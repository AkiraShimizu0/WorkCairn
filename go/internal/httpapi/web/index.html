<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WorkCairn">
  <title>WorkCairn</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-i18n-pending>
  <noscript><p class="i18n-fatal">表示にはJavaScriptが必要です。 / JavaScript is required to display WorkCairn.</p></noscript>
  <div class="page-shell">
    <header class="topbar">
      <div class="topbar-start">
        <button id="menu-button" class="menu-button" type="button" hidden aria-label="" data-i18n-aria-label="static.menu.open" aria-controls="nav-drawer" aria-expanded="false">☰</button>
        <a class="brand" href="/" aria-label="" data-i18n-aria-label="static.home">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><strong>WorkCairn</strong></span>
        </a>
      </div>
      <div class="topbar-actions">
        <span id="background-status" class="background-status" hidden><i aria-hidden="true"></i><span data-i18n="static.company.working"></span></span>
        <span id="connection-status" class="status-dot" data-i18n="static.connection.checking"></span>
        <label class="locale-control"><span class="visually-hidden" data-i18n="locale.label"></span><select id="locale-select" aria-label="日本語 / English"><option value="ja">日本語</option><option value="en">English</option></select></label>
        <button id="settings-button" class="settings-button icon-button" type="button" hidden aria-label="" data-i18n-aria-label="static.settings" title="" data-i18n-title="static.settings"><span aria-hidden="true">⚙</span></button>
      </div>
    </header>

    <main>
      <section id="pairing-view" class="center-card" hidden>
        <p class="eyebrow">LOCAL PAIRING</p>
        <h1 data-i18n="static.pair.heading"></h1>
        <p class="supporting" data-i18n="static.pair.support"></p>
        <form id="pairing-form" class="stack-form">
          <label for="pairing-code" data-i18n="static.pair.code"></label>
          <input id="pairing-code" name="code" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required>
          <button class="button primary" type="submit" data-i18n="static.pair.submit"></button>
        </form>
      </section>

      <section id="workspace-view" hidden>
        <div id="nav-backdrop" class="nav-backdrop" hidden></div>
        <nav id="nav-drawer" class="nav-drawer" hidden aria-label="" data-i18n-aria-label="static.nav.main">
          <div class="nav-drawer-heading">
            <p class="eyebrow">MENU</p>
            <h2>WorkCairn</h2>
          </div>
          <div class="nav-drawer-links">
            <button id="nav-employees-home" class="nav-link" type="button" data-i18n="static.nav.employees"></button>
            <button id="nav-request-list" class="nav-link" type="button" data-i18n="static.nav.requests"></button>
            <button id="nav-new-request" class="nav-link" type="button" data-i18n="static.nav.new"></button>
            <button id="nav-current-request" class="nav-link" type="button" hidden data-i18n="static.nav.current"></button>
            <button id="nav-settings" class="nav-link" type="button" data-i18n="static.settings"></button>
          </div>
        </nav>

        <div class="workspace-layout">
          <aside id="requests-pane" class="requests-pane">
            <section id="request-list-view" class="request-pane-view request-list-view">
              <header class="list-header">
                <h1 class="pane-title" data-i18n="static.requests"></h1>
                <div class="list-actions">
                  <button id="new-request-button" class="button primary icon-action-button new-request-button" type="button" aria-label="" data-i18n-aria-label="static.new" title="" data-i18n-title="static.new">
                    <svg class="icon-action-svg" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                      <path d="M12 5v14M5 12h14"/>
                    </svg>
                  </button>
                  <button id="refresh-button" class="icon-action-button" type="button" aria-label="" data-i18n-aria-label="static.refresh" title="" data-i18n-title="static.refresh">
                    <svg class="icon-action-svg" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
                      <path d="M21 3v6h-6"/>
                    </svg>
                  </button>
                </div>
              </header>
              <div id="session-list-filter" class="session-list-filter" role="tablist" aria-label="" data-i18n-aria-label="static.request.filter">
                <button id="session-filter-active" class="session-filter-tab" type="button" role="tab" aria-selected="true" aria-controls="session-list" data-i18n="static.requests"></button>
                <button id="session-filter-archived" class="session-filter-tab" type="button" role="tab" aria-selected="false" aria-controls="session-list" data-i18n="static.archived"></button>
              </div>
              <div id="session-list" class="session-list" role="tabpanel"></div>
            </section>

            <section id="request-detail-view" class="request-pane-view request-detail-view request-thread" hidden>
              <header class="thread-header thread-header-sticky">
                <button id="back-to-list-button" class="text-link back-button" type="button" data-i18n="static.back.requests"></button>
                <div id="request-summary" class="request-summary" aria-live="polite"></div>
                <h2 id="completion-heading" class="visually-hidden" hidden data-i18n="static.complete.heading"></h2>
              </header>

              <div id="thread-scroll" class="thread-scroll">
                <h2 id="timeline-heading" class="visually-hidden" data-i18n="static.timeline.heading"></h2>
                <div id="activity-timeline" class="conversation-thread" aria-labelledby="timeline-heading"></div>
                <details id="details-panel" class="detail-panel" hidden>
                  <summary aria-controls="details-content" data-i18n="static.details"></summary>
                  <div id="details-content" class="detail-content"></div>
                </details>
                <button id="thread-jump-latest" class="thread-jump-latest" type="button" hidden data-i18n="static.new.update"></button>
              </div>

              <footer class="thread-footer">
                <div id="quick-replies" class="quick-replies" aria-live="polite"></div>
                <section id="active-card" class="action-card" aria-live="polite" hidden></section>
                <form id="thread-composer" class="thread-composer" aria-label="" data-i18n-aria-label="static.composer">
                    <div class="composer-shell">
                    <p class="visually-hidden" data-i18n="static.background.help"></p>
                    <p id="composer-status" class="composer-status visually-hidden" aria-hidden="true"></p>
                    <div id="bounded-acceptance-row" class="bounded-acceptance-row" hidden>
                      <label class="bounded-acceptance-label">
                        <input type="checkbox" id="bounded-acceptance-toggle" />
                        <span data-i18n="static.bounded.label"></span>
                      </label>
                      <p id="bounded-acceptance-constraints" class="bounded-acceptance-constraints" hidden data-i18n="static.bounded.help"></p>
                    </div>
                    <div class="composer-input-row">
                      <textarea id="composer-input" name="message" rows="2" placeholder="" data-i18n-placeholder="static.message.placeholder" aria-label="" data-i18n-aria-label="static.message.label"></textarea>
                      <button id="composer-send" class="button primary composer-send" type="submit" aria-label="" data-i18n-aria-label="static.send" title="" data-i18n-title="static.send"><span class="composer-send-icon" aria-hidden="true">↑</span></button>
                    </div>
                  </div>
                </form>
              </footer>

              <div class="request-insights-hidden visually-hidden" aria-hidden="true">
                <span>PROOF OF WORK</span>
                <span>AUTONOMY CONTRACT</span>
                <span>CEO ATTENTION</span>
                <div id="proof-of-work"></div>
                <div id="autonomy-summary"></div>
                <div id="attention-grid" class="attention-grid"></div>
              </div>
            </section>
          </aside>

          <aside id="employees-pane" class="employees-pane">
            <section class="employee-status-section" aria-labelledby="employee-status-heading" hidden>
              <header class="pane-heading employee-status-heading">
                <div>
                  <h1 id="employee-status-heading" data-i18n="static.company.heading"></h1>
                </div>
                <span id="team-count" class="count-chip"></span>
              </header>
              <div id="employee-grid" class="employee-grid employee-office-visual"></div>
            </section>
            <section class="company-attention-section" aria-labelledby="company-attention-heading">
              <h2 id="company-attention-heading" class="feed-heading" data-i18n="static.attention.heading"></h2>
              <div id="company-attention" class="company-attention" aria-live="polite"></div>
            </section>
            <section class="company-feed-section" aria-labelledby="company-feed-heading" hidden>
              <h2 id="company-feed-heading" class="feed-heading" data-i18n="static.feed.heading"></h2>
              <div id="company-feed" class="company-feed" aria-live="polite"></div>
            </section>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <dialog id="request-dialog" class="sheet-dialog" hidden aria-hidden="true"></dialog>

  <dialog id="action-dialog" class="sheet-dialog">
    <form id="action-form" method="dialog" class="sheet"></form>
  </dialog>

  <dialog id="settings-dialog" class="sheet-dialog">
    <section class="sheet" aria-labelledby="settings-heading">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-heading">
        <div>
          <p class="eyebrow">SETTINGS</p>
          <h2 id="settings-heading">AI Connections</h2>
        </div>
        <button class="icon-button" type="button" data-close-dialog aria-label="" data-i18n-aria-label="static.close">×</button>
      </div>
      <p class="supporting" data-i18n="static.settings.support"></p>
      <label class="settings-locale"><span data-i18n="locale.label"></span><select id="settings-locale-select" aria-label="日本語 / English"><option value="ja">日本語</option><option value="en">English</option></select></label>
      <div id="provider-settings" aria-live="polite"></div>
      <div id="storage-settings" aria-live="polite"></div>
      <section class="routing-settings" aria-labelledby="routing-heading">
        <div class="settings-section-heading">
          <div><p class="eyebrow">ROUTING</p><h3 id="routing-heading">Automatic</h3></div>
          <span class="state-chip" data-i18n="static.recommended"></span>
        </div>
        <p data-i18n="static.routing.help"></p>
        <details class="advanced-settings">
          <summary>Advanced</summary>
          <p data-i18n="static.routing.advanced"></p>
        </details>
      </section>
      <div class="sheet-actions settings-actions">
        <button id="provider-status-refresh" class="button quiet" type="button" data-i18n="static.status.refresh"></button>
        <button class="button primary" type="button" data-close-dialog data-i18n="static.close"></button>
      </div>
    </section>
  </dialog>

  <dialog id="setup-dialog" class="sheet-dialog setup-dialog">
    <section class="sheet" aria-labelledby="setup-heading">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-heading">
        <div><p class="eyebrow">FIRST-RUN SETUP</p><h2 id="setup-heading" data-i18n="static.welcome"></h2></div>
        <button class="icon-button" type="button" data-close-dialog aria-label="" data-i18n-aria-label="static.close">×</button>
      </div>
      <p class="supporting" data-i18n="static.setup.support"></p>
      <div id="setup-content" class="setup-content" aria-live="polite"></div>
    </section>
  </dialog>

  <div id="busy-overlay" class="busy-overlay" hidden>
    <div class="busy-card" role="status">
      <span class="spinner" aria-hidden="true"></span>
      <strong id="busy-title" data-i18n="static.busy.title"></strong>
      <p id="busy-message" data-i18n="static.busy.message"></p>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
